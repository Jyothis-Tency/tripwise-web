<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mægler Tours and Travels – Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=Source+Serif+4:wght@700&display=swap">
<style>
:root{--bg:#f4f4f5;--line:#d9d9dc;--label:#6b6b70;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--line:#2a2a2a;--label:#8a8a8a}}
:root[data-theme="dark"]{--bg:#121212;--line:#2a2a2a;--label:#8a8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;padding:32px 20px}
h1{font-weight:400;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--label);text-align:center;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1000px;margin:0 auto}
figure{margin:0;border:1px solid var(--line);border-radius:16px;padding:24px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:16px}
figure svg{width:100%;max-width:440px;height:auto;display:block}
figcaption{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#6b6b70}
</style>
</head>
<body>
<h1>Mægler · Logo</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <text id="word" x="130" y="553" font-family="'Source Serif 4','Droid Serif',Georgia,serif" font-size="220" font-weight="700" fill="#000" textLength="775" lengthAdjust="spacing">m<tspan fill="#ee0a0a">æ</tspan>gler</text>
  </defs>
</svg>

<div class="grid">
  <figure>
    <svg viewBox="70 330 900 340" role="img" aria-label="Mægler logo">
      <rect x="70" y="330" width="900" height="340" fill="#fff"/>
      <use href="#word"/>
    </svg>
    <figcaption>Logo only</figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 1024 1024" role="img" aria-label="Mægler Tours and Travels logo">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="25" y="25" width="974" height="974" rx="48" fill="none" stroke="#000" stroke-width="6"/>
      <rect x="36" y="36" width="952" height="952" rx="38" fill="none" stroke="#000" stroke-width="2"/>
      <use href="#word"/>
      <text x="145" y="705" font-family="'EB Garamond',Garamond,Georgia,serif" font-size="100" fill="#000" textLength="737" lengthAdjust="spacing">Tours and Travels</text>
    </svg>
    <figcaption>Logo with text</figcaption>
  </figure>
</div>
</body>
</html>
