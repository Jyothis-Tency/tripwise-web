<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Line – Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f4f4f5;--line:#d9d9dc;--label:#6b6b70;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--line:#2a2a2a;--label:#8a8a8a}}
:root[data-theme="dark"]{--bg:#121212;--line:#2a2a2a;--label:#8a8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Open Sans',system-ui,sans-serif;padding:32px 20px}
h1{font-weight:400;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--label);text-align:center;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:960px;margin:0 auto}
figure{margin:0;border:1px solid var(--line);border-radius:16px;padding:24px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:16px}
figure svg{width:100%;max-width:380px;height:auto;display:block}
figcaption{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#6b6b70}
</style>
</head>
<body>
<h1>Right Line · Logo</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="mark">
      <path fill="#000" d="M459 414 L459 150 Q459 72 505 72 L888 72 L900 84 L690 283 L825 414 L750 414 L617 285 L783 118 L548 118 Q517 118 517 150 L517 414 Z"/>
      <path fill="#000" d="M527 193 L553 165 L603 213 L679 137 L735 135 L605 267 Z"/>
      <path fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="28 26" d="M488 414 L488 150 Q488 88 540 88 L885 88"/>
    </g>
  </defs>
</svg>

<div class="grid">
  <figure>
    <svg viewBox="420 20 520 446" role="img" aria-label="Right Line logo mark">
      <rect x="420" y="20" width="520" height="446" fill="#fff"/>
      <use href="#mark"/>
    </svg>
    <figcaption>Logo only</figcaption>
  </figure>

  <figure>
    <svg viewBox="200 22 880 656" role="img" aria-label="Right Line – The Travel Expert logo">
      <rect x="200" y="22" width="880" height="656" fill="#fff"/>
      <use href="#mark"/>
      <text x="268" y="575" font-family="'Open Sans',system-ui,sans-serif" font-size="112" font-weight="400" fill="#000" textLength="744" lengthAdjust="spacing">RIGHT LINE</text>
      <text x="419" y="628" font-family="'Open Sans',system-ui,sans-serif" font-size="39" font-weight="500" fill="#000" textLength="456" lengthAdjust="spacing">THE TRAVEL EXPERT</text>
    </svg>
    <figcaption>Logo with text</figcaption>
  </figure>
</div>
</body>
</html>
