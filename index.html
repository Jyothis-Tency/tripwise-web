<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" />
    <link rel="shortcut icon" href="/favicon.svg?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tripwise — Comprehensive trip management system for fleet owners and drivers. Track trips, manage expenses, and monitor your fleet." />
    <meta name="theme-color" content="#12243A" />
    <meta property="og:title" content="Tripwise — Trip Management System" />
    <meta property="og:description" content="Fleet trip management for owners and drivers." />
    <meta property="og:image" content="/tripwise-logo.png?v=7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Tripwise — Trip Management System</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('tripwise.theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          const raw = localStorage.getItem('userData');
          if (raw) {
            const u = JSON.parse(raw);
            const c = (u.company || '').toLowerCase();
            const e = (u.email || '').toLowerCase();
            const n = (u.name || '').toLowerCase();
            const isRightline = c.includes('rightline') || c.includes('right line') || e.includes('rightline') || n.includes('rightline');
            const isMaegler = c.includes('maegler') || c.includes('mægler') || e.includes('maegler') || n.includes('maegler') || n.includes('hibathulla');
            const isInway = c.includes('inway') || e.includes('inwaycabs') || n.includes('inway');
            const fav = isRightline ? '/rightline-favicon.svg' : isMaegler ? '/maegler-favicon.svg' : isInway ? '/inway-favicon.svg' : '/favicon.svg?v=8';
            const title = isRightline ? 'Right Line — Trip Management System' : isMaegler ? 'Mægler — Trip Management System' : isInway ? 'Inway Cabs — Trip Management System' : 'Tripwise — Trip Management System';
            document.title = title;
            const links = document.querySelectorAll("link[rel~='icon'], link[rel='shortcut icon'], link[rel='apple-touch-icon']");
            links.forEach(function(l) { l.href = fav; });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
