<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hexBg" x1="18%" y1="8%" x2="86%" y2="92%">
      <stop offset="0%" stop-color="#151d30"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="purpleBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="hexGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.42"/>
    </filter>
    <filter id="accentGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#38bdf8" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Hexagon badge -->
  <g filter="url(#hexGlow)">
    <polygon
      points="256,22 464,136 464,376 256,490 48,376 48,136"
      fill="url(#hexBg)"/>
    <polygon
      points="256,22 464,136 464,376 256,490 48,376 48,136"
      fill="none"
      stroke="#243047"
      stroke-width="4"/>
  </g>

  <!-- Vertical spine -->
  <rect x="247" y="88" width="18" height="292" rx="5" fill="#1a2336"/>

  <!-- Roof beams -->
  <path d="M 256 104 L 156 196"
        fill="none"
        stroke="url(#purpleBeam)"
        stroke-width="20"
        stroke-linecap="round"/>
  <path d="M 256 104 L 356 196"
        fill="none"
        stroke="url(#cyanBeam)"
        stroke-width="20"
        stroke-linecap="round"/>
  <g filter="url(#accentGlow)">
    <circle cx="256" cy="96" r="12" fill="#38bdf8"/>
    <circle cx="256" cy="96" r="4.5" fill="#e0f2fe"/>
  </g>

  <!-- Car body: soft rounded silhouette -->
  <path d="
    M 120 278
    C 120 252, 138 236, 164 234
    C 178 214, 204 198, 236 194
    L 276 194
    C 308 198, 334 214, 348 234
    C 374 236, 392 252, 392 278
    C 392 298, 378 310, 358 310
    L 154 310
    C 134 310, 120 298, 120 278
    Z"
    fill="url(#carBody)"/>

  <!-- Cyan bumper / axle stubs -->
  <rect x="98" y="282" width="26" height="9" rx="4" fill="#38bdf8"/>
  <rect x="388" y="282" width="26" height="9" rx="4" fill="#38bdf8"/>

  <!-- Body center accent -->
  <circle cx="256" cy="296" r="5.5" fill="#38bdf8"/>

  <!-- Wheels — white tyres, purple rim, cyan hub -->
  <g transform="translate(176, 308)">
    <circle cx="0" cy="0" r="36" fill="#ffffff"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#7c3aed" stroke-width="10"/>
    <circle cx="0" cy="0" r="12" fill="#0b1120"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
  </g>
  <g transform="translate(336, 308)">
    <circle cx="0" cy="0" r="36" fill="#ffffff"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#7c3aed" stroke-width="10"/>
    <circle cx="0" cy="0" r="12" fill="#0b1120"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
  </g>

  <!-- Direction chevrons -->
  <path d="M 220 352 L 256 380 L 292 352"
        fill="none"
        stroke="#7c3aed"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M 220 384 L 256 412 L 292 384"
        fill="none"
        stroke="#38bdf8"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
